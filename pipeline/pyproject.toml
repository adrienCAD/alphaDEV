[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphajet"
version = "0.0.1"
description = "AI across the subsurface workflow: seismic to economics"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "scikit-learn", "matplotlib", "segyio", "lasio"]

[project.scripts]
alphajet-mc = "alphajet.uncertainty.run_waterflood_mc:main"

[project.optional-dependencies]
dev = ["pytest", "ruff", "jupyter"]
ml = ["torch"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
